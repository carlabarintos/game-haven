name: iOS TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Logic checks
        run: zsh tests/run.sh

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen

      - name: Archive and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archive unsigned (a development profile would need a registered device), then
          # -exportArchive signs for the App Store via the API key (cloud signing): no certs or profiles in secrets.
          xcodebuild archive -project GameHaven.xcodeproj -scheme GameHaven -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/GameHaven.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }}
          plutil -replace teamID -string "$TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GameHaven.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/out" "${auth[@]}"
